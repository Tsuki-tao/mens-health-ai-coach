<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEN'S HEALTH — AI Health & Fitness Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide-static/0.383.0/lucide.min.js" defer></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== SIDEBAR (desktop) ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <span>MEN'S</span>
        <span>HEALTH</span>
      </div>
      <p class="brand-sub">AI HEALTH COACH</p>
    </div>

    <nav class="nav" id="mainNav">
      <button class="nav-item" data-view="dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></button>
      <button class="nav-item" data-view="plan"><i data-lucide="calendar-clock"></i><span>My Plan</span></button>
      <button class="nav-item" data-view="food"><i data-lucide="salad"></i><span>Food</span></button>
      <button class="nav-item" data-view="sleep"><i data-lucide="moon"></i><span>Sleep</span></button>
      <button class="nav-item" data-view="workout"><i data-lucide="dumbbell"></i><span>Workout</span></button>
      <button class="nav-item" data-view="hydration"><i data-lucide="droplets"></i><span>Hydration</span></button>
      <button class="nav-item" data-view="coach"><i data-lucide="sparkles"></i><span>AI Coach</span></button>
      <button class="nav-item" data-view="tips"><i data-lucide="lightbulb"></i><span>Health Tips</span></button>
      <button class="nav-item" data-view="progress"><i data-lucide="trending-up"></i><span>Progress</span></button>
      <button class="nav-item" data-view="profile"><i data-lucide="user-circle"></i><span>Profile</span></button>
    </nav>

    <div class="sidebar-footer">
      <div class="today-box">
        <span class="today-label">Today</span>
        <span class="today-date" id="todayDate">—</span>
      </div>
      <button class="profile-mini" data-view="profile">
        <div class="avatar-mini" id="avatarMini">U</div>
        <div class="profile-mini-info">
          <span id="profileMiniName">Guest</span>
          <span id="profileMiniLevel">ตั้งค่าโปรไฟล์</span>
        </div>
      </button>
    </div>
  </aside>

  <!-- ===================== TOP BAR (mobile) ===================== -->
  <header class="topbar" id="topbar">
    <button class="hamburger" id="hamburgerBtn" aria-label="เปิดเมนู"><i data-lucide="menu"></i></button>
    <div class="brand-logo brand-logo--sm"><span>MEN'S</span><span>HEALTH</span></div>
    <button class="topbar-avatar" data-view="profile" aria-label="โปรไฟล์"><div class="avatar-mini" id="avatarMiniTop">U</div></button>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ===================== MAIN CONTENT ===================== -->
  <main class="main" id="mainContent">
    <!-- Views injected by app.js -->
  </main>

  <!-- ===================== BOTTOM NAV (mobile) ===================== -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="bnav-item" data-view="dashboard"><i data-lucide="layout-dashboard"></i><span>หน้าหลัก</span></button>
    <button class="bnav-item" data-view="food"><i data-lucide="salad"></i><span>อาหาร</span></button>
    <button class="bnav-item bnav-item--main" data-view="coach"><i data-lucide="sparkles"></i><span>AI Coach</span></button>
    <button class="bnav-item" data-view="workout"><i data-lucide="dumbbell"></i><span>ออกกำลังกาย</span></button>
    <button class="bnav-item" data-view="progress"><i data-lucide="trending-up"></i><span>ความคืบหน้า</span></button>
  </nav>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/aiService.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
